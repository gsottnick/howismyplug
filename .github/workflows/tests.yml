# Runs both test suites on every pull request and on main. Branch rules
# require these checks to pass before a PR can merge.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    name: Node tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test 'tests/*.test.mjs'

  panel:
    name: Panel tests
    runs-on: ubuntu-latest
    # A plain Ubuntu container runs as root, so Qt's runtime libraries install
    # without privilege escalation anywhere in this repo.
    container: ubuntu:24.04
    env:
      # The Omarchy releases whose Commons/Ui the panel is tested against: the
      # current stable one and the next one (the plugin adapts to each). Pinned
      # so a change in Omarchy can't fail unrelated PRs; move them along as
      # Omarchy ships.
      OMARCHY_REFS: v4.0.6 v4.5.0-rc3
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install git, Python, Qt's runtime libraries and D-Bus
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends ca-certificates git python3 python3-venv \
            libegl1 libgl1 libglib2.0-0 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core \
            dbus

      - uses: actions/checkout@v7

      - name: Fetch Omarchy's shell components
        run: |
          for ref in $OMARCHY_REFS; do
            git clone -q --depth 1 --branch "$ref" https://github.com/basecamp/omarchy.git "$RUNNER_TEMP/omarchy-$ref"
          done

      # Below 6.12: Qt 6.12's QtQuick exports its own `Color`, which shadows
      # Omarchy's in this harness (see AGENTS.md).
      - name: Install PySide6
        run: |
          python3 -m venv .venv-harness
          .venv-harness/bin/pip install -q 'PySide6>=6.10,<6.12'

      - name: Run the panel suite on each Omarchy
        working-directory: tests
        run: |
          for ref in $OMARCHY_REFS; do
            echo "::group::Omarchy $ref"
            OMARCHY_SHELL="$RUNNER_TEMP/omarchy-$ref/shell" ../.venv-harness/bin/python -m unittest panel_test -v
            echo "::endgroup::"
          done

      - name: No symlinks in the plugin (omarchy plugin validate rejects them)
        run: |
          found="$(git ls-files -s | awk '$1 == "120000" {print $4}')"
          [ -z "$found" ] || { echo "symlinks: $found"; exit 1; }
